name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests and OpenSpec
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f62b9760757247ec93b1f9d18bb431293bbeac77 # v0.1.2
          path: .ci-legacy-v012
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned tools
        run: |
          python -m pip install uv==0.12.9
          npm install --global @fission-ai/openspec@1.16.0
      - name: Install current and legacy environments
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --no-dev --directory .ci-legacy-v012
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate specifications
        run: openspec validate --specs --strict
      - name: Run complete test suite
        env:
          ZHENZHEN_TEST_V012_INSTALL: ${{ github.workspace }}\.ci-legacy-v012
        run: .venv/Scripts/python.exe -m pytest -q --basetemp="${{ runner.temp }}/zhenzhen-tests"
