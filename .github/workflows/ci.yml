name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests and OpenSpec
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f62b9760757247ec93b1f9d18bb431293bbeac77 # v0.1.2
          path: .ci-legacy-v012
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned tools
        run: |
          python -m pip install uv==0.12.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv python install 3.12.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --global @fission-ai/openspec@1.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install current and legacy environments
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --no-dev --directory .ci-legacy-v012
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate specifications
        run: openspec validate --specs --strict
      - name: Inspect runner ownership behavior
        run: |
          .venv/Scripts/python.exe -c "import pathlib, tempfile, win32security as w; from zhenzhen_gptimage.mcp_api.private_runtime import _windows_create, _windows_current_sid; p=pathlib.Path(tempfile.mkdtemp())/'private'; _windows_create(p); d=w.GetNamedSecurityInfo(str(p),w.SE_FILE_OBJECT,w.OWNER_SECURITY_INFORMATION|w.DACL_SECURITY_INFORMATION); c,_=d.GetSecurityDescriptorControl(); print('owner_is_current_user=', d.GetSecurityDescriptorOwner()==_windows_current_sid(), 'dacl_protected=', bool(c & w.SE_DACL_PROTECTED), 'ace_count=', d.GetSecurityDescriptorDacl().GetAceCount())"
      - name: Test runtime ACL under runner's default token
        run: .venv/Scripts/python.exe -m pytest tests/test_private_runtime.py tests/test_discovery.py -q --basetemp="${{ runner.temp }}/zhenzhen-acl-tests"
      - name: Run complete test suite
        env:
          ZHENZHEN_TEST_V012_INSTALL: ${{ github.workspace }}\.ci-legacy-v012
        run: .venv/Scripts/python.exe tests/run_windows_ci.py
