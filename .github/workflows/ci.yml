name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/classify_changes.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate OpenSpec
        run: |
          npm install --global @fission-ai/openspec@1.16.0
          openspec validate --specs --strict

  feature-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.classify.outputs.docs_only != 'true'
    needs: classify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f62b9760757247ec93b1f9d18bb431293bbeac77 # v0.1.2
          path: .ci-legacy-v012
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked environments
        run: |
          python -m pip install uv==0.12.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv python install 3.12.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --no-dev --directory .ci-legacy-v012
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run related tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZHENZHEN_TEST_V012_INSTALL: ${{ github.workspace }}\.ci-legacy-v012
        run: .venv/Scripts/python.exe .github/scripts/related_tests.py

  merge-verification:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.verify.outputs.reuse }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_merge.py

  release-verification:
    if: always() && ((github.event_name == 'pull_request' && github.base_ref == 'main' && needs.classify.result == 'success') || (github.event_name == 'push' && needs.merge-verification.outputs.reuse != 'true'))
    needs: [classify, merge-verification]
    name: Windows full release verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f62b9760757247ec93b1f9d18bb431293bbeac77 # v0.1.2
          path: .ci-legacy-v012
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned tools
        run: |
          python -m pip install uv==0.12.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv python install 3.12.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --global @fission-ai/openspec@1.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install current and legacy environments
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --no-dev --directory .ci-legacy-v012
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate specifications
        run: openspec validate --specs --strict
      - name: Test runtime ACL under runner's default token
        run: .venv/Scripts/python.exe -m pytest tests/test_private_runtime.py tests/test_discovery.py -q --basetemp="${{ runner.temp }}/zhenzhen-acl-tests"
      - name: Run complete test suite
        env:
          ZHENZHEN_TEST_V012_INSTALL: ${{ github.workspace }}\.ci-legacy-v012
        run: .venv/Scripts/python.exe tests/run_windows_ci.py
      - name: Build candidate
        if: github.event_name == 'pull_request'
        run: |
          uv build --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse 'HEAD^{tree}' | Set-Content -Encoding utf8 candidate-tree.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain release candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.event.pull_request.number }}
          path: |
            dist/*
            candidate-tree.txt
          if-no-files-found: error
          retention-days: 30
